name: Auto-update profile README

# Runs on push, on a schedule, and can be triggered manually.
# Only includes jobs that work with the default GITHUB_TOKEN — no
# extra secrets, personal access tokens, or third-party accounts needed.
on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # Fills in the "Recent Activity" section in README.md with your
  # latest commits, PRs, issues, and stars.
  update-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: "chore: update recent activity"

  # Regenerates the animated contribution snake (light + dark variants)
  # on the `output` branch, referenced directly in README.md.
  update-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: BugBasherX
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=B5502A&color_dots=F5F1E8,D6D1C4,B0AA98,8A8578,1A1A1A
            dist/github-contribution-grid-snake-dark.svg?color_snake=B5502A&color_dots=1A1A1A,3A362E,5C574B,8A8578,D6D1C4
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
