name: Auto-update profile README

# Runs on a schedule (every 4 hours), on every push, and can be triggered manually.
# This is what makes the README "live" — no manual regeneration needed.
on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # 1. Fills in the "Recent GitHub Activity" section with your latest
  #    commits, PRs, issues, and stars — refreshed automatically.
  update-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: "chore: update recent activity"

  # 2. Regenerates the animated contribution snake (light + dark variants)
  #    on the `output` branch, referenced directly in the README.
  update-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: BugBasherX
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Regenerates the isometric 3D contribution calendar.
  update-3d-contrib:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated calendar
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib/*.svg
          git commit -m "chore: update 3d contribution calendar" || echo "nothing to commit"
          git push

  # 4. OPTIONAL — fills the "Weekly Coding Activity" section using WakaTime.
  #    Requires a WakaTime account and a WAKATIME_API_KEY repo secret.
  #    Delete this job (and its README section) if you don't use WakaTime.
  update-waka:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TITLE: true
