<svg width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#00D9C0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1B2030"/>
    </pattern>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0E1A" stop-opacity="1"/>
      <stop offset="70%" stop-color="#0B0E1A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0B0E1A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="240" fill="#0B0E1A"/>
  <rect width="1000" height="240" fill="url(#dots)"/>
  <rect width="1000" height="240" fill="url(#fade)"/>

  <text x="60" y="115" font-family="Consolas, Menlo, monospace" font-size="56" font-weight="700" fill="#E6E8F0">
    YUVII
  </text>
  <rect x="60" y="128" width="150" height="6" rx="3" fill="url(#accent)"/>

  <text x="60" y="168" font-family="Consolas, Menlo, monospace" font-size="18" fill="#8892A6">
    <tspan fill="#00D9C0">&gt;</tspan> Front-end developer building AI-driven, real-world software
  </text>

  <rect x="424" y="157" width="10" height="20" fill="#00D9C0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="205" font-family="Consolas, Menlo, monospace" font-size="14" fill="#4A5268">
    AI &amp; Automation · Cybersecurity · Open Source
  </text>

  <rect x="0" y="236" width="1000" height="4" fill="url(#accent)"/>
</svg>
